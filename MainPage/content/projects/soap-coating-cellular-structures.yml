  - type: rich_text
    body: >-
      <p>In this research, the wireframe of a shellular structure approximating the Schwarz P
      surface that is designed in PGS is soaked into a soap solution. The wireframe is 3D printed
      using plastic. Two solutions were used: a polymer and graphene oxide (GO) aqueous mixture, and
      a polymer aqueous solution. These solutions fill the faces of the polyhedral structure with a
      soap film, improving structural performance. Strut-based cellular structures designed in PGS
      lack the desired shear capacity; adding the films across the faces improves shear capacity.</p>

      <p>Related publication: Chi, Gao, Akbari, et al. “Geometrically Templated, Ultra-Lightweight
      and High Strength Soap Films from Lyotropic Liquid Crystalline Graphene Oxide/Polymer
      Composites.” <em>Advanced Functional Materials</em>, 2025.</p>
