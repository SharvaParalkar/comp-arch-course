page_content: |-
  *PI · Assistant Professor of Architecture · Texas A&M University*

  Mostafa is a distinguished computational designer and researcher with a distinctive academic background encompassing architectural design and computational structures. He specializes in Computational Structures and Advanced Manufacturing. His academic journey includes a Ph.D. in Computational Design and a Master of Advanced Architectural Design from the University of Pennsylvania, a Master’s in Architecture from Shahid Beheshti University, and a Bachelor’s in Architecture from the University of Tehran.

  His scholarly work focuses on structural form finding, especially 3-dimensional Graphic Statics and Shellular Funicular Structures — shell-based cellular geometries designed through 3D graphic statics. That approach has opened new directions across architecture, structural design, and material systems. He also works extensively in digital fabrication, computational design, and human–computer interaction, rethinking tectonics as architecture, robotics, computation, and material science converge.

  He has collaborated internationally, including as a designer and researcher at Gensler, and practiced independently in architectural design and construction.

