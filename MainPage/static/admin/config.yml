backend:
  name: github
  repo: SharvaParalkar/comp-arch-course
  branch: main
  base_url: https://cms-auth.sharvaparalkar.workers.dev
  auth_endpoint: /auth

site_url: https://calab.net
display_url: https://calab.net

media_folder: "MainPage/static/uploads"
public_folder: "/uploads"
publish_mode: simple

media_library:
  name: cloudinary
  # Keep raw URLs (PDFs, videos, .gh, .3dm). Image transforms break non-image downloads.
  use_transformations: false
  config:
    cloud_name: dbf3aqsxu
    api_key: 251365553116344

collections:
  - name: settings
    label: "1 · Site Settings"
    description: "Global navigation, footer, and default SEO. Edit these rarely."
    files:
      - label: Global Settings
        name: site
        file: MainPage/content/site.yml
        fields:
          - { label: Site Name, name: site_name, widget: string }
          - { label: Tagline, name: tagline, widget: text, required: false }
          - { label: Copyright, name: copyright, widget: string, required: false }
          - label: Navigation
            name: navigation
            widget: list
            summary: "{{label}} → {{url}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string, hint: "e.g. about.html or projects.html" }
          - label: Social Links
            name: social_links
            widget: list
            required: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Footer Links
            name: footer_links
            widget: list
            required: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Default SEO
            name: default_seo
            widget: object
            collapsed: true
            required: false
            hint: "All fields optional. Empty values will not block Save."
            fields:
              - { label: Description, name: description, widget: text, required: false }
              - { label: OG Image, name: og_image, widget: image, required: false }

  - name: pages
    label: "2 · Pages"
    label_singular: Page
    description: "Home, Team, Projects listing, Publications, Teaching, and other pages. Use the visual editor to change the page body."
    folder: MainPage/content/pages
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{permalink}}"
    sortable_fields: ["title", "permalink"]
    preview_path: "{{fields.permalink}}"
    fields:
      - label: Page Title
        name: title
        widget: string
        hint: "Shown in the browser tab and in the Pages list."
      - label: Web Address
        name: permalink
        widget: string
        hint: "e.g. /about.html or /index.html. Keep the leading slash."
      - label: Page Body (Visual Editor)
        name: visual_page
        widget: visual_page
        required: false
        hint: "Open the visual editor to change the page heading, introduction, image, automatic grids, and every content section. Click Apply, then Publish."
      - label: Home Page Hero Text
        name: home_hero_text
        widget: object
        collapsed: true
        required: false
        hint: "Home page only. If you set a logo here, it replaces the two hero title lines."
        fields:
          - { label: Hero Logo, name: hero_logo_src, widget: image, required: false }
          - { label: First line, name: hero_title_line_1, widget: string, required: false }
          - { label: Second line, name: hero_title_line_2, widget: string, required: false }
          - { label: Subtitle, name: hero_subtitle, widget: string, required: false }
      - label: Team Members
        name: team_members
        widget: list
        required: false
        summary: "{{name}} · {{title}}"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Image, name: image, widget: image, required: false }
          - { label: Profile Page URL, name: profile_url, widget: string, required: false, hint: "Optional page opened by clicking the person's image or name." }
          - { label: Website, name: website, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
      - label: Team Hierarchy
        name: team_groups
        widget: list
        required: false
        summary: "{{title}}"
        hint: "Create ordered groups such as Leadership, Researchers, and Students. Add people under each group."
        fields:
          - { label: Group Title, name: title, widget: string }
          - label: Members
            name: members
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Profile Page URL, name: profile_url, widget: string, required: false, hint: "Optional page opened by clicking the person's image or name." }
              - { label: Website, name: website, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
      - label: Search & Social Preview (SEO)
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false, hint: "The sentence search engines and social cards show." }
          - { label: OG Title, name: og_title, widget: string, required: false }
          - { label: OG Description, name: og_description, widget: text, required: false }
          - { label: OG Image, name: og_image, widget: image, required: false }
  - name: projects
    label: "3 · Projects"
    label_singular: Project
    description: "Each project has a detail page and a card on the Projects grid. Use the visual editor for both."
    folder: MainPage/content/projects
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "projects/{{slug}}.html"
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Detail page and listing card title. The visual editor can change the shorter card overlay title."
      - label: Permalink
        name: permalink
        widget: string
        required: false
        hint: "e.g. /projects/my-project.html"
      - label: Year
        name: year
        widget: string
        required: false
        hint: "Shown in the Projects list and on the card."
      - label: Featured on Home
        name: featured
        widget: boolean
        default: false
        required: false
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
        hint: "Lower numbers appear first on the grid."
      - label: Search and Social Preview (SEO)
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false }
          - { label: OG Title, name: og_title, widget: string, required: false }
          - { label: OG Description, name: og_description, widget: text, required: false }
          - { label: OG Image, name: og_image, widget: image, required: false }
      - label: Detail Page and Card (Visual Editor)
        name: visual_page
        widget: visual_page
        required: false
        hint: "Open the visual editor to change the detail page, the listing card, images, and design. Click Apply, then Publish."

  - name: publications
    label: "4 · Publications"
    label_singular: Publication
    description: "Each entry appears on the Publications page as a card with an image, authors, venue, and links."
    folder: MainPage/content/publications
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "publications.html"
    fields:
      - { label: Title, name: title, widget: string, hint: "The title shown on the publication card." }
      - { label: Year, name: year, widget: string, required: false }
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
        hint: "Lower numbers appear first on the Publications page."
      - label: Publication Card (Visual Editor)
        name: visual_page
        widget: visual_page
        required: false
        hint: "Open the visual editor to change the image, authors, venue, links, and image design. Click Apply, then Publish."

  - name: teaching
    label: "5 · Teaching"
    label_singular: Teaching
    description: "Courses, seminars, studios, and workshops. Each entry has a detail page and a card on the Teaching page."
    folder: MainPage/content/teaching
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "teaching/{{slug}}.html"
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Detail page and listing card title. The visual editor can change the shorter card overlay title."
      - label: Permalink
        name: permalink
        widget: string
        required: false
        hint: "e.g. /teaching/structures-seminar.html"
      - label: Year
        name: year
        widget: string
        required: false
        hint: "Shown in the Teaching list and on the card."
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
        hint: "Lower numbers appear first on the grid."
      - label: Search and Social Preview (SEO)
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false }
          - { label: OG Title, name: og_title, widget: string, required: false }
      - label: Detail Page and Card (Visual Editor)
        name: visual_page
        widget: visual_page
        required: false
        hint: "Open the visual editor to change the detail page, the listing card, images, and design. Click Apply, then Publish."
