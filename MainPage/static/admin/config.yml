backend:
  name: github
  repo: SharvaParalkar/comp-arch-course
  branch: main
  base_url: https://cms-auth.sharvaparalkar.workers.dev
  auth_endpoint: /auth

site_url: https://calab.net
display_url: https://calab.net

media_folder: "MainPage/static/uploads"
public_folder: "/uploads"
publish_mode: simple

media_library:
  name: cloudinary
  # Keep raw URLs (PDFs, videos, .gh, .3dm). Image transforms break non-image downloads.
  use_transformations: false
  config:
    cloud_name: dbf3aqsxu
    api_key: 251365553116344

collections:
  - name: settings
    label: "1 · Site Settings"
    description: "Global navigation, footer, and default SEO. Edit these rarely."
    files:
      - label: Global Settings
        name: site
        file: MainPage/content/site.yml
        fields:
          - { label: Site Name, name: site_name, widget: string }
          - { label: Tagline, name: tagline, widget: text, required: false }
          - { label: Copyright, name: copyright, widget: string, required: false }
          - label: Navigation
            name: navigation
            widget: list
            summary: "{{label}} → {{url}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string, hint: "e.g. about.html or projects.html" }
          - label: Social Links
            name: social_links
            widget: list
            required: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Footer Links
            name: footer_links
            widget: list
            required: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Default SEO
            name: default_seo
            widget: object
            collapsed: true
            required: false
            hint: "All fields optional — empty values will not block Save."
            fields:
              - { label: Description, name: description, widget: text, required: false }
              - { label: OG Image, name: og_image, widget: image, required: false }

  - name: pages
    label: "2 · Pages"
    label_singular: Page
    description: "Home, Team, Projects listing, Publications, Teaching, and other pages."
    folder: MainPage/content/pages
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{permalink}}"
    sortable_fields: ["title", "permalink"]
    preview_path: "{{fields.permalink}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Permalink
        name: permalink
        widget: string
        hint: "e.g. /about.html or /index.html"
      - { label: Page Heading, name: page_heading, widget: string, required: false, hint: "Heading shown at the top of this page" }
      - label: Main Image
        name: page_image
        widget: image
        required: false
        hint: "Optional image shown beside the page text"
      - { label: Image Alt Text, name: page_image_alt, widget: string, required: false }
      - label: Page Content
        name: page_content
        widget: markdown
        required: false
        hint: "Edit the page text here. Use the toolbar for headings, links, lists, and images."
      - label: Home Page Hero Text
        name: home_hero_text
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Hero Logo, name: hero_logo_src, widget: image, required: false, hint: "If set, this logo replaces the two hero title lines." }
          - { label: First line, name: hero_title_line_1, widget: string, required: false }
          - { label: Second line, name: hero_title_line_2, widget: string, required: false }
          - { label: Subtitle, name: hero_subtitle, widget: string, required: false }
      - label: Body Class
        name: body_class
        widget: string
        default: body
        required: false
        hint: "Advanced — usually leave as body"
      - label: Show Projects Grid
        name: show_projects_grid
        widget: boolean
        default: false
        required: false
        hint: "Turn on for the Projects page. Renders all Projects as a card grid automatically."
      - label: Show Publications Grid
        name: show_publications_list
        widget: boolean
        default: false
        required: false
        hint: "Turn on for the Publications page. Renders all Publications with image, text, and links."
      - label: Show Teaching Grid
        name: show_teaching_grid
        widget: boolean
        default: false
        required: false
        hint: "Turn on for the Teaching page. Renders all Teaching entries as a card grid."
      - label: Show Team Grid
        name: show_team_grid
        widget: boolean
        default: false
        required: false
        hint: "Turn on for the Team page."
      - label: Show Contact Form
        name: show_contact_form
        widget: boolean
        default: false
        required: false
        hint: "Turn on for the Contact page."
      - label: Team Members
        name: team_members
        widget: list
        required: false
        summary: "{{name}} · {{title}}"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Image, name: image, widget: image, required: false }
          - { label: Profile Page URL, name: profile_url, widget: string, required: false, hint: "Optional page opened by clicking the person's image or name." }
          - { label: Website, name: website, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
      - label: Team Hierarchy
        name: team_groups
        widget: list
        required: false
        summary: "{{title}}"
        hint: "Create ordered groups such as Leadership, Researchers, and Students. Add people under each group."
        fields:
          - { label: Group Title, name: title, widget: string }
          - label: Members
            name: members
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Profile Page URL, name: profile_url, widget: string, required: false, hint: "Optional page opened by clicking the person's image or name." }
              - { label: Website, name: website, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false }
          - { label: OG Title, name: og_title, widget: string, required: false }
          - { label: OG Description, name: og_description, widget: text, required: false }
          - { label: OG Image, name: og_image, widget: image, required: false }
      - label: Advanced Layout Blocks
        name: sections
        widget: list
        collapsed: true
        required: false
        summary: "{{type}}"
        hint: "Add headlines, images, video, and text. Drag to reorder. Use Image / Image Gallery to add media."
        types:
          - label: Hero with Video
            name: hero_video
            widget: object
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Video URL, name: video_url, widget: string, hint: "Direct .mp4 URL" }
          - label: Hero with Image
            name: hero_image
            widget: object
            summary: "{{title}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - { label: CTA Label, name: cta_label, widget: string, required: false }
              - { label: CTA URL, name: cta_url, widget: string, required: false }
          - label: Home Masthead
            name: home_masthead
            widget: object
            summary: "{{title_line_1}} {{title_line_2}}"
            fields:
              - { label: Title line 1, name: title_line_1, widget: string }
              - { label: Title line 2, name: title_line_2, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Low-quality WebM, name: video_lq_url, widget: string, required: false, hint: "Instant-load ~2–3MB WebM (poster replacement)" }
              - { label: Low-quality MP4, name: video_lq_mp4_url, widget: string, required: false, hint: "Safari fallback ~2–3MB H.264" }
              - { label: High-quality MP4, name: video_hq_url, widget: string, required: false, hint: "Background-loaded ~9MB H.264; crossfades in when ready" }
              - { label: Ultra-quality MP4, name: video_ultra_url, widget: string, required: false, hint: "Cloudinary (or CDN) URL — must stay under Cloudflare Pages 25 MiB if hosted locally" }
          - label: Headline
            name: headline
            widget: object
            summary: "{{text}}"
            fields:
              - { label: Text, name: text, widget: text }
          - label: Two Column Text
            name: two_column
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Left Column, name: left, widget: markdown, required: false }
              - { label: Right Column, name: right, widget: markdown, required: false }
          - label: Full-width Video
            name: video
            widget: object
            fields:
              - { label: Video URL, name: video_url, widget: string }
              - { label: Caption, name: caption, widget: string, required: false }
          - label: Full-width Image
            name: image
            widget: object
            summary: "{{alt}}"
            fields:
              - { label: Image, name: image, widget: image, hint: "Upload here or pick from Media / Cloudinary" }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
              - label: Image Frame
                name: fit_mode
                widget: select
                default: fit
                required: false
                options:
                  - { label: "Fit (show whole image)", value: fit }
                  - { label: "Fill (crop to fill frame)", value: fill }
          - label: Image + Text
            name: image_text
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - label: Image Position
                name: image_position
                widget: select
                default: right
                options: ["left", "right"]
              - { label: Body, name: body, widget: markdown, required: false }
              - label: Image Frame
                name: fit_mode
                widget: select
                default: fill
                required: false
                options:
                  - { label: "Fill (crop to fill frame)", value: fill }
                  - { label: "Fit (show whole image)", value: fit }
          - label: Image Gallery
            name: image_gallery
            widget: object
            fields:
              - label: Images
                name: images
                widget: list
                summary: "{{alt}}"
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt Text, name: alt, widget: string, required: false }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - label: Image Frame
                    name: fit_mode
                    widget: select
                    default: fit
                    required: false
                    options:
                      - { label: "Fit (show whole image)", value: fit }
                      - { label: "Fill (crop to fill frame)", value: fill }
          - label: Stat
            name: stat
            widget: object
            summary: "{{label}}: {{value}}"
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: Value, name: value, widget: string }
          - label: Rich Text
            name: rich_text
            widget: object
            fields:
              - { label: Body, name: body, widget: markdown, required: false }
          - label: PDF Embed
            name: pdf
            widget: object
            summary: "{{title}}"
            fields:
              - { label: PDF File, name: file, widget: file, media_folder: /static/uploads/cv, public_folder: /uploads/cv }
              - { label: Title, name: title, widget: string, required: false, hint: "Accessibility title for the embed" }
              - { label: Download Label, name: download_label, widget: string, required: false, default: "Download PDF" }
  - name: projects
    label: "3 · Projects"
    label_singular: Project
    description: "Each project is a card on the Projects grid plus its own detail page. Edit Cover Image + Summary first, then detail sections."
    folder: MainPage/content/projects
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "projects/{{slug}}.html"
    fields:
      - { label: Title, name: title, widget: string, hint: "Detail page + card title" }
      - label: Permalink
        name: permalink
        widget: string
        required: false
        hint: "e.g. /projects/my-project.html"
      - label: Cover Image
        name: cover_image
        widget: image
        required: false
        hint: "Main image on the Projects grid — upload or choose from Cloudinary"
      - label: Square Card Images
        name: card_images
        widget: list
        required: false
        min: 2
        max: 2
        hint: "Two complementary images for the square projects-page carousel. Preview the center square crop."
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Alt Text, name: alt, widget: string, required: false }
      - label: Overlay Title
        name: card_title
        widget: string
        required: false
        hint: "Optional white text overlaid on the cover image"
      - label: Year
        name: year
        widget: string
        required: false
        hint: "e.g. 2023"
      - label: Category
        name: category
        widget: string
        required: false
        default: Research
        hint: "e.g. Research or Design/Research"
      - label: Summary
        name: summary
        widget: text
        required: false
        hint: "Short blurb shown under the card on the Projects grid"
      - label: Featured on Home
        name: featured
        widget: boolean
        default: false
        required: false
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
        hint: "Lower numbers appear first on the grid"
      - label: Body Class
        name: body_class
        widget: string
        default: body
        required: false
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false }
          - { label: OG Title, name: og_title, widget: string, required: false }
          - { label: OG Description, name: og_description, widget: text, required: false }
          - { label: OG Image, name: og_image, widget: image, required: false }
      - label: Write Project Content
        name: quick_content
        widget: markdown
        required: false
        hint: "Write normally. Use the toolbar for headings, links, lists, and images. Content appears below the project description blocks."
      - label: Advanced Layout Blocks
        name: sections
        widget: list
        collapsed: true
        required: false
        summary: "{{type}}"
        hint: "Content for the project detail page. Add Full-width Image or Image Gallery to place media."
        types:
          - label: Hero with Video
            name: hero_video
            widget: object
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Video URL, name: video_url, widget: string }
          - label: Hero with Image
            name: hero_image
            widget: object
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - { label: CTA Label, name: cta_label, widget: string, required: false }
              - { label: CTA URL, name: cta_url, widget: string, required: false }
          - label: Headline
            name: headline
            widget: object
            summary: "{{text}}"
            fields:
              - { label: Text, name: text, widget: text }
          - label: Two Column Text
            name: two_column
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Left Column, name: left, widget: markdown, required: false }
              - { label: Right Column, name: right, widget: markdown, required: false }
          - label: Full-width Video
            name: video
            widget: object
            fields:
              - { label: Video URL, name: video_url, widget: string }
              - { label: Caption, name: caption, widget: string, required: false }
          - label: Full-width Image
            name: image
            widget: object
            fields:
              - { label: Image, name: image, widget: image, hint: "Upload or pick from Media / Cloudinary" }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
              - label: Image Frame
                name: fit_mode
                widget: select
                default: fit
                required: false
                options:
                  - { label: "Fit (show whole image)", value: fit }
                  - { label: "Fill (crop to fill frame)", value: fill }
          - label: Image + Text
            name: image_text
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - label: Image Position
                name: image_position
                widget: select
                default: right
                options: ["left", "right"]
              - { label: Body, name: body, widget: markdown, required: false }
              - label: Image Frame
                name: fit_mode
                widget: select
                default: fill
                required: false
                options:
                  - { label: "Fill (crop to fill frame)", value: fill }
                  - { label: "Fit (show whole image)", value: fit }
          - label: Image Gallery
            name: image_gallery
            widget: object
            fields:
              - label: Images
                name: images
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt Text, name: alt, widget: string, required: false }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - label: Image Frame
                    name: fit_mode
                    widget: select
                    default: fit
                    required: false
                    options:
                      - { label: "Fit (show whole image)", value: fit }
                      - { label: "Fill (crop to fill frame)", value: fill }
          - label: Stat
            name: stat
            widget: object
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: Value, name: value, widget: string }
          - label: Rich Text
            name: rich_text
            widget: object
            fields:
              - { label: Body, name: body, widget: markdown, required: false }
  - name: publications
    label: "4 · Publications"
    label_singular: Publication
    description: "Each entry appears on the Publications page with an image, authors, venue, and PDF / BibTeX links."
    folder: MainPage/content/publications
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "publications.html"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: text, required: false }
      - { label: Venue, name: venue, widget: string, required: false, hint: "e.g. IASS 2023" }
      - { label: Year, name: year, widget: string, required: false }
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
        hint: "Lower numbers appear first"
      - label: Image
        name: image
        widget: image
        required: false
        hint: "Thumbnail shown beside the publication"
      - label: PDF URL
        name: pdf_url
        widget: string
        required: false
        hint: "Link to PDF (/uploads/... or external URL)"
      - label: BibTeX URL
        name: bibtex_url
        widget: string
        required: false
        hint: "Link to a .bib / .txt file"
      - label: Article URL
        name: article_url
        widget: string
        required: false
        hint: "Optional DOI or publisher page"
      - label: BibTeX
        name: bibtex
        widget: text
        required: false
        hint: "Optional inline BibTeX (used if no BibTeX URL)"

  - name: teaching
    label: "5 · Teaching"
    label_singular: Teaching
    description: "Courses, seminars, studios, and workshops. Each card appears on the Teaching page."
    folder: MainPage/content/teaching
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["sort_order", "year", "title"]
    preview_path: "teaching/{{slug}}.html"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Permalink
        name: permalink
        widget: string
        required: false
        hint: "e.g. /teaching/structures-seminar.html"
      - { label: Cover Image, name: cover_image, widget: image, required: false }
      - { label: Overlay Title, name: card_title, widget: string, required: false }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false, hint: "Seminar, Studio, Workshop" }
      - { label: Instructors, name: instructors, widget: string, required: false }
      - { label: Summary, name: summary, widget: text, required: false }
      - label: Write Teaching Page Content
        name: quick_content
        widget: markdown
        required: false
        hint: "Write normally. Use the toolbar for headings, links, lists, and images."
      - label: Sort Order
        name: sort_order
        widget: number
        required: false
        value_type: int
      - { label: Body Class, name: body_class, widget: string, default: body, required: false }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Description, name: description, widget: text, required: false }
          - { label: OG Title, name: og_title, widget: string, required: false }
      - label: Advanced Layout Blocks
        name: sections
        widget: list
        collapsed: true
        required: false
        summary: "{{type}}"
        types:
          - label: Headline
            name: headline
            widget: object
            fields:
              - { label: Text, name: text, widget: text }
          - label: Full-width Image
            name: image
            widget: object
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Alt Text, name: alt, widget: string, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
              - label: Image Frame
                name: fit_mode
                widget: select
                default: fit
                required: false
                options:
                  - { label: "Fit (show whole image)", value: fit }
                  - { label: "Fill (crop to fill frame)", value: fill }
          - label: Rich Text
            name: rich_text
            widget: object
            fields:
              - { label: Body, name: body, widget: markdown, required: false }
